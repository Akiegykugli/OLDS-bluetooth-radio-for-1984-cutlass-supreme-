; =====================================================================
; OLDS - ESP32 radio head unit (Cutlass Supreme)  -  PlatformIO project
; Firmware v2.0.0  (Bluetooth A2DP + DS3231 clock + TM1637 + control bench)
;
; Folder layout:
;   platformio.ini
;   add_build_epoch.py     <- stamps the build time into the firmware
;   src/main.cpp
; =====================================================================

[env:esp32dev]
; Pinned on purpose: espressif32 6.9.0 = Arduino-ESP32 core 2.0.17 / ESP-IDF 4.4.7.
; main.cpp uses the legacy I2S structs (i2s_config_t, i2s_pin_config_t),
; which exist in this core. Do NOT use a newer core without re-testing the audio.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Bluetooth Classic + A2DP is a big program. huge_app.csv gives the app
; 3 MB of flash (no OTA, which is not used here) so it can never run out of space.
board_build.partitions = huge_app.csv

; Libraries come straight from GitHub (the PlatformIO registry did not
; find pschatzmann/ESP32-A2DP @ ~1.8.0).
;   ESP32-A2DP : BluetoothA2DPSink.h
;                Pinned to release tag v1.8.7 (Feb 2025). v1.8.11 does NOT compile
;                on core 2.0.17: it uses ESP_A2D_AUDIO_STATE_SUSPEND, a name that
;                only exists in newer ESP-IDF (4.4.7 calls it ..._REMOTE_SUSPEND).
;                The build warning "AudioTools library is not included" is harmless:
;                this project uses the plain I2S driver, not AudioTools.
;   RTClib     : RTClib.h   (needs Adafruit BusIO, listed explicitly below)
;   TM1637     : TM1637Display.h
; Installed versions of the other libraries (from the first build log):
;   RTClib 2.1.4 (sha 5298434), Adafruit BusIO 1.17.4 (sha 3b83642),
;   TM1637 sha 3cca196. Pinned below to those exact commits.
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    https://github.com/adafruit/RTClib.git#5298434
    https://github.com/adafruit/Adafruit_BusIO.git#3b83642
    https://github.com/avishorp/TM1637.git#3cca196

; Defines BUILD_EPOCH (UTC seconds at build time) for the clock fallback.
; If this script ever fails, BUILD_EPOCH stays 0 and main.cpp handles that.
extra_scripts = post:add_build_epoch.py